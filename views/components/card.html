<div class="card">
  <div style="display:flex; justify-content: space-between; align-items:center;">
    <h3 class="card-title">{{NAME}}</h3>
    <span class="method-badge">{{METHOD}}</span>
  </div>
  <p style="color:var(--text-muted); margin: 8px 0;">{{DESCRIPTION}}</p>
  <p style="font-size: 0.8rem; color: var(--text-muted);">Author: {{AUTHOR}} | Category: {{CATEGORY}}</p>
  <code style="display: block; margin-top: 8px; color: var(--accent);">/api{{PATH}}</code>
</div>
