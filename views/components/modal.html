<div id="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center;">
  <div style="background: var(--bg-card); padding: 2rem; border-radius: 8px; max-width: 500px; width: 90%;">
    <h3>API Details</h3>
    <p id="modal-content" style="margin: 1rem 0; color: var(--text-muted);"></p>
    <button onclick="document.getElementById('modal').style.display='none'" style="padding: 8px 16px; background: var(--accent); border: none; border-radius: 4px; cursor: pointer;">Close</button>
  </div>
</div>
