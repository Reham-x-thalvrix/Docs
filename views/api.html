<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Tester</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/footer.css">
</head>
<body>
  <div class="container">
    <div id="navbar-placeholder"></div>

    <main>
      <div style="background: var(--bg-card); padding: 1.5rem; border-radius: 8px; border: 1px solid var(--border);">
        <h2>Quick Tester</h2>
        <form id="test-form" style="margin-top: 1rem; display: flex; gap: 10px;">
          <input type="text" id="test-url" placeholder="Enter image or file URL..." required style="flex:1; padding: 10px; background: #0a0f1d; border: 1px solid var(--border); color: white; border-radius: 6px;">
          <button type="submit" style="padding: 10px 20px; background: var(--accent); border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Test Catbox</button>
        </form>
        <pre id="json-response" style="margin-top: 1rem; background: #0a0f1d; padding: 1rem; border-radius: 6px; overflow-x: auto; color: #38bdf8;">Response will appear here...</pre>
      </div>
    </main>

    <div id="footer-placeholder"></div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
