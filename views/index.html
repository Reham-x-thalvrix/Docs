<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JUBAYER REST API - Ultra Animated UI</title>
  
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/favicon.ico">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --nitro-red: #ff1a40;
      --nitro-red-glow: rgba(255, 26, 64, 0.5);
      --bg-black: #08070b;
      --bg-card: #110e16;
      --bg-card-hover: #181420;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #ffffff;
      --text-muted: #8b8598;
      --accent-pink: #d946ef;
    }

    /* Universal Anti-Highlight & Anti-Select Properties */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      
      /* ১. মোবাইলে বাটনে ক্লিকে নীল আলোর হাইলাইট বন্ধ */
      -webkit-tap-highlight-color: transparent;
      
      /* ২. বাটন বা লেখায় চাপ দিলে অনাকাঙ্ক্ষিত কপি/সিলেক্ট বন্ধ */
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }

    /* শুধু ইনপুট ফিল্ড ও কোড দেখার জায়গায় কপি/টাইপ এলাউ রাখা */
    input, textarea, pre, code {
      user-select: text !important;
      -webkit-user-select: text !important;
    }

    body {
      background-color: var(--bg-black) !important;
      color: var(--text-main) !important;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Full Screen Page Loader */
    .page-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-black);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
    }

    .page-loader.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    .loader-content {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .nitro-spinner {
      width: 60px;
      height: 60px;
      border: 3px solid var(--border-color);
      border-top-color: var(--nitro-red);
      border-right-color: var(--accent-pink);
      border-radius: 50%;
      animation: nitroSpin 0.7s linear infinite;
      box-shadow: 0 0 25px var(--nitro-red-glow);
    }

    @keyframes nitroSpin {
      to { transform: rotate(360deg); }
    }

    /* Glowing Ambient Background Animation */
    .nitro-glow {
      position: absolute;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 650px;
      height: 350px;
      background: radial-gradient(circle, var(--nitro-red-glow) 0%, rgba(0,0,0,0) 70%);
      z-index: 0;
      pointer-events: none;
      animation: floatGlow 6s ease-in-out infinite alternate;
    }

    @keyframes floatGlow {
      0% { transform: translateX(-50%) translateY(0px) scale(1); opacity: 0.8; }
      100% { transform: translateX(-50%) translateY(20px) scale(1.1); opacity: 1; }
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
      padding: 16px;
      position: relative;
      z-index: 1;
      animation: fadeInPage 0.8s ease-out;
    }

    @keyframes fadeInPage {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Navbar Header */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .brand:hover .brand-icon {
      transform: rotate(10deg) scale(1.1);
    }

    .logo-txt {
      font-size: 1.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 30%, var(--nitro-red) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge-ui {
      background: var(--nitro-red);
      color: white;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 12px;
      box-shadow: 0 0 10px var(--nitro-red-glow);
      animation: pulseBadge 2s infinite;
    }

    @keyframes pulseBadge {
      0%, 100% { box-shadow: 0 0 8px var(--nitro-red-glow); }
      50% { box-shadow: 0 0 18px var(--nitro-red); }
    }

    .search-toggle {
      font-size: 1.2rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .search-toggle:hover {
      color: white;
      transform: scale(1.2) rotate(90deg);
    }

    .search-container {
      display: none;
      margin-bottom: 16px;
      animation: slideDown 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .search-container input {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: white;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .search-container input:focus {
      border-color: var(--nitro-red);
      box-shadow: 0 0 12px var(--nitro-red-glow);
    }

    /* Animated Hero Banner GIF */
    .hero-banner {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      margin-bottom: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .hero-banner:hover {
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 12px 30px rgba(255, 26, 64, 0.25);
    }

    /* Music Control Widget */
    .music-player-bar {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      transition: border-color 0.3s ease;
    }

    .music-player-bar:hover {
      border-color: rgba(255, 26, 64, 0.3);
    }

    .music-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .disc-icon {
      font-size: 1.4rem;
      color: var(--text-muted);
      transition: transform 0.3s ease;
    }

    .disc-icon.spinning {
      color: var(--nitro-red);
      animation: spinDisc 3s linear infinite;
    }

    @keyframes spinDisc {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .music-control-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: var(--nitro-red);
      color: white;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px var(--nitro-red-glow);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .music-control-btn:hover {
      transform: scale(1.15);
    }

    /* Animated Stats Cards Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 14px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      display: flex;
      flex-direction: column;
    }

    .stat-card:hover {
      background: var(--bg-card-hover);
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .stat-card.active {
      border-color: var(--nitro-red);
      box-shadow: 0 0 15px rgba(255, 26, 64, 0.3);
      transform: translateY(-2px);
    }

    .stat-card.active .stat-num {
      font-weight: 800;
      color: var(--nitro-red);
    }

    .stat-num {
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--text-muted);
      transition: color 0.3s;
    }

    /* Accordion Category Items with Hover Effects */
    .accordion-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cat-item {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.3s ease, transform 0.3s ease;
    }

    .cat-item:hover {
      border-color: rgba(255, 255, 255, 0.18);
    }

    .cat-header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .cat-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      color: var(--accent-pink);
    }

    .cat-badge {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
    }

    .cat-arrow {
      color: var(--text-muted);
      transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    .cat-item.open .cat-arrow {
      transform: rotate(180deg);
      color: var(--nitro-red);
    }

    .cat-body {
      display: none;
      padding: 0 16px 16px 16px;
      flex-direction: column;
      gap: 8px;
    }

    .cat-item.open .cat-body {
      display: flex;
      animation: accordionExpand 0.35s ease-out;
    }

    @keyframes accordionExpand {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Interactive API Rows */
    .api-row {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.25s ease;
    }

    .api-row:hover {
      background: rgba(255, 26, 64, 0.08);
      border-color: rgba(255, 26, 64, 0.3);
      transform: translateX(4px);
    }

    .three-dot-btn {
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .three-dot-btn:hover {
      color: var(--nitro-red);
      transform: scale(1.3);
    }

    /* Modal Animation */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px);
      z-index: 1000; justify-content: center; align-items: center; padding: 16px;
    }

    .modal-content {
      background: #131019; border: 1px solid var(--border-color);
      border-radius: 16px; width: 100%; max-width: 450px; padding: 22px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.9);
      animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes modalPop {
      from { opacity: 0; transform: scale(0.85) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .btn {
      padding: 10px 18px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-submit {
      background: linear-gradient(135deg, #d946ef, var(--nitro-red));
      color: white;
    }

    .btn:hover { transform: translateY(-2px); }
    .btn-submit:hover { box-shadow: 0 0 15px var(--nitro-red-glow); }
  </style>
</head>
<body>

  <div id="page-loader" class="page-loader">
    <div class="loader-content">
      <div class="nitro-spinner"></div>
      <h2>JUBAYER API</h2>
      <p>Initializing Nitro Engine...</p>
    </div>
  </div>

  <div class="nitro-glow"></div>

  <div class="container">
    <nav class="navbar">
      <div class="brand">
        <img src="/favicon.ico" alt="Logo" class="brand-icon" onerror="this.style.display='none'">
        <span class="logo-txt">JUBAYER API</span>
        <span class="badge-ui">PRO UI</span>
      </div>
      <div class="nav-right">
        <i class="fa-solid fa-magnifying-glass search-toggle" id="search-btn"></i>
      </div>
    </nav>

    <div class="search-container" id="search-container">
      <input type="text" id="search-input" placeholder="Search endpoints...">
    </div>

    <img src="/banner.gif" alt="Hero Banner" class="hero-banner" onerror="this.style.display='none'">

    <div class="music-player-bar">
      <div class="music-info">
        <i class="fa-solid fa-compact-disc disc-icon" id="disc-icon"></i>
        <div class="track-details">
          <span class="track-title" style="font-size: 0.85rem; font-weight: 700;">Background Music</span>
          <span class="track-status" id="music-status" style="font-size: 0.75rem; color: var(--text-muted);">Tap to Play</span>
        </div>
      </div>
      <button class="music-control-btn" id="music-toggle-btn">
        <i class="fa-solid fa-play" id="music-icon"></i>
      </button>
      <audio id="bg-music" loop preload="auto">
        <source src="/music.mp3" type="audio/mpeg">
      </audio>
    </div>

    <div class="stats-grid">
      <div class="stat-card active" data-filter="all">
        <span class="stat-num" id="stat-total">0</span>
        <span class="stat-label" style="font-size:0.8rem; color:var(--text-muted);">Total APIs</span>
      </div>
      <div class="stat-card" data-filter="get">
        <span class="stat-num" id="stat-get">0</span>
        <span class="stat-label" style="font-size:0.8rem; color:var(--text-muted);">GET Endpoints</span>
      </div>
      <div class="stat-card" data-filter="post">
        <span class="stat-num" id="stat-post">0</span>
        <span class="stat-label" style="font-size:0.8rem; color:var(--text-muted);">POST Endpoints</span>
      </div>
      <div class="stat-card" data-filter="categories">
        <span class="stat-num" id="stat-cats">0</span>
        <span class="stat-label" style="font-size:0.8rem; color:var(--text-muted);">Categories</span>
      </div>
    </div>

    <main>
      <div id="category-accordion" class="accordion-container"></div>
    </main>

    <footer class="footer" id="footer-text" style="text-align:center; padding: 30px 0; color:var(--text-muted); font-size: 0.85rem;">
      Loading stats...
    </footer>
  </div>

  <div class="modal-overlay" id="api-modal">
    <div class="modal-content">
      <div class="modal-header" style="display:flex; justify-content:space-between; margin-bottom:16px;">
        <div>
          <h2 id="modal-title" style="color: var(--accent-pink); font-size:1.2rem;">API Name</h2>
          <p id="modal-desc" style="color:var(--text-muted); font-size:0.85rem;">API Description</p>
        </div>
        <button class="modal-close" id="modal-close-btn" style="background:none; border:none; color:var(--text-muted); font-size:1.4rem; cursor:pointer;">&times;</button>
      </div>
      <div class="modal-body">
        <div id="modal-params-container"></div>
        <div class="modal-actions" style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
          <button class="btn btn-cancel" id="btn-cancel" style="background:#1f1b26; color:var(--text-muted);">Cancel</button>
          <button class="btn btn-submit" id="btn-submit">Submit</button>
        </div>
        <div id="response-box" style="display:none; margin-top:16px; background:#08060b; border:1px solid var(--border-color); padding:12px; border-radius:8px; max-height:200px; overflow-y:auto;">
          <pre id="response-data" style="color:#38bdf8; font-size:0.8rem;"></pre>
        </div>
      </div>
    </div>
  </div>

  <script src="/theme.js"></script>
  <script src="/search.js"></script>
  <script src="/app.js"></script>
</body>
</html>
