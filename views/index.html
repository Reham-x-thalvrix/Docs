<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JUBAYER REST API</title>

  <!-- External CSS -->
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/cards.css">
  <link rel="stylesheet" href="/css/footer.css">

  <style>
    :root {
      --bg-primary: #0a0f1d;
      --bg-card: #131b2e;
      --accent: #38bdf8;
      --text-primary: #f1f5f9;
      --text-muted: #64748b;
      --border: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: var(--bg-primary) !important; color: var(--text-primary); min-height: 100vh; }
    .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
    .navbar { display: flex; justify-content: space-between; align-items: center; padding: 1rem 0; border-bottom: 1px solid var(--border); margin-bottom: 2rem; }
    .brand { font-size: 1.5rem; font-weight: bold; color: var(--accent); }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; }
    .method-badge { background: #0284c7; color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; }
    .footer { margin-top: 4rem; padding: 2rem 0; text-align: center; border-top: 1px solid var(--border); color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="container">
    <nav class="navbar">
      <div class="brand">JUBAYER REST API</div>
    </nav>

    <main>
      <div style="margin-bottom: 1.5rem;">
        <input type="text" id="search-input" placeholder="Search APIs..." style="width:100%; padding: 12px; background: var(--bg-card); border: 1px solid var(--border); color: white; border-radius: 6px; outline: none;">
      </div>

      <div id="cards-container" class="card-grid">
        <p>Loading API endpoints...</p>
      </div>
    </main>

    <footer class="footer">
      <p>&copy; Rest API Dashboard - All Rights Reserved</p>
    </footer>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
