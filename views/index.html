<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JUBAYER REST API - Dark Nitro</title>
  
  <!-- App Favicon & Touch Icons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/favicon.ico">

  <!-- Icons & Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- CSS Styles -->
  <style>
    :root {
      --nitro-red: #ff1a40;
      --nitro-red-glow: rgba(255, 26, 64, 0.45);
      --bg-black: #08070b;
      --bg-card: #110e16;
      --bg-card-hover: #181420;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #ffffff;
      --text-muted: #8b8598;
      --accent-pink: #d946ef;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-black) !important;
      color: var(--text-main) !important;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Page Initial Loader Overlay */
    .page-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-black);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .page-loader.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    .loader-content {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .nitro-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid var(--border-color);
      border-top-color: var(--nitro-red);
      border-right-color: var(--accent-pink);
      border-radius: 50%;
      animation: nitroSpin 0.8s linear infinite;
      box-shadow: 0 0 20px var(--nitro-red-glow);
    }

    .loader-content h2 {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 30%, var(--nitro-red) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }

    .loader-content p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    @keyframes nitroSpin {
      to { transform: rotate(360deg); }
    }

    /* Ambient Glow */
    .nitro-glow {
      position: absolute;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 600px;
      height: 300px;
      background: radial-gradient(circle, var(--nitro-red-glow) 0%, rgba(0,0,0,0) 70%);
      z-index: 0;
      pointer-events: none;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
      padding: 16px;
      position: relative;
      z-index: 1;
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      object-fit: cover;
    }

    .logo-txt {
      font-size: 1.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 30%, var(--nitro-red) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge-ui {
      background: var(--nitro-red);
      color: white;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 12px;
      box-shadow: 0 0 10px var(--nitro-red-glow);
    }

    .search-toggle {
      font-size: 1.2rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.2s;
    }

    .search-toggle:hover { color: white; }

    .search-container {
      display: none;
      margin-bottom: 16px;
    }

    .search-container input {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: white;
      outline: none;
    }

    /* Hero Banner GIF */
    .hero-banner {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      margin-bottom: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
    }

    /* Music Player Bar Widget */
    .music-player-bar {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .music-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .disc-icon {
      font-size: 1.4rem;
      color: var(--text-muted);
      transition: transform 0.3s ease;
    }

    .disc-icon.spinning {
      color: var(--nitro-red);
      animation: spinDisc 3s linear infinite;
    }

    @keyframes spinDisc {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .track-details {
      display: flex;
      flex-direction: column;
    }

    .track-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .track-status {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .music-control-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--nitro-red);
      color: white;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px var(--nitro-red-glow);
      transition: transform 0.2s ease;
    }

    .music-control-btn:active { transform: scale(0.92); }

    /* Dashboard Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 14px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
    }

    .stat-card:hover { background: var(--bg-card-hover); }

    .stat-card.active {
      border-color: var(--nitro-red);
      box-shadow: 0 0 15px rgba(255, 26, 64, 0.2);
    }

    .stat-card.active .stat-num {
      font-weight: 800;
      color: var(--nitro-red);
    }

    .stat-card.active .stat-label {
      font-weight: 700;
      color: white;
    }

    .stat-num {
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Accordion Categories */
    .accordion-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cat-item {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .cat-header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .cat-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      color: var(--accent-pink);
    }

    .cat-badge {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
    }

    .cat-arrow {
      color: var(--text-muted);
      transition: transform 0.3s ease;
    }

    .cat-item.open .cat-arrow { transform: rotate(180deg); }

    .cat-body {
      display: none;
      padding: 0 16px 16px 16px;
      flex-direction: column;
      gap: 8px;
    }

    .cat-item.open .cat-body { display: flex; }

    /* API Endpoints */
    .api-row {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .api-row-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .three-dot-btn {
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
    }

    .three-dot-btn:hover { color: white; }

    .api-name {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .method-tag {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .method-tag.get { background: rgba(16, 185, 129, 0.15); color: #10b981; }
    .method-tag.post { background: rgba(236, 72, 153, 0.15); color: #ec4899; }

    /* Footer */
    .footer { text-align: center; padding: 30px 0; color: var(--text-muted); font-size: 0.85rem; }

    /* Modal Dialog Pop-up */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px);
      z-index: 1000; justify-content: center; align-items: center; padding: 16px;
    }

    .modal-content {
      background: #131019; border: 1px solid var(--border-color);
      border-radius: 16px; width: 100%; max-width: 450px; padding: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }

    .modal-header { display: flex; justify-content: space-between; margin-bottom: 16px; }
    .modal-title { color: var(--accent-pink); font-size: 1.2rem; }
    .modal-desc { color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; }
    .modal-close { background: none; border: none; color: var(--text-muted); font-size: 1.4rem; cursor: pointer; }

    .param-group { margin-bottom: 12px; }
    .param-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    .param-group input {
      width: 100%; padding: 10px; background: #09070d; border: 1px solid var(--border-color);
      border-radius: 8px; color: white; outline: none;
    }

    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .btn { padding: 10px 18px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; }
    .btn-cancel { background: #1f1b26; color: var(--text-muted); }
    .btn-submit { background: linear-gradient(135deg, #d946ef, var(--nitro-red)); color: white; }

    .response-box {
      margin-top: 16px; background: #08060b; border: 1px solid var(--border-color);
      padding: 12px; border-radius: 8px; max-height: 200px; overflow-y: auto;
    }
    .response-box pre { color: #38bdf8; font-size: 0.8rem; }
  </style>
</head>
<body>

  <!-- Full Screen Initial Page Loader -->
  <div id="page-loader" class="page-loader">
    <div class="loader-content">
      <div class="nitro-spinner"></div>
      <h2>JUBAYER API</h2>
      <p>Initializing Nitro Engine...</p>
    </div>
  </div>

  <!-- Ambient Glow Effect -->
  <div class="nitro-glow"></div>

  <div class="container">
    <nav class="navbar">
      <div class="brand">
        <img src="/favicon.ico" alt="Logo" class="brand-icon" onerror="this.style.display='none'">
        <span class="logo-txt">JUBAYER API</span>
        <span class="badge-ui">PRO UI</span>
      </div>
      <div class="nav-right">
        <i class="fa-solid fa-magnifying-glass search-toggle" id="search-btn"></i>
      </div>
    </nav>

    <!-- Search Bar -->
    <div class="search-container" id="search-container">
      <input type="text" id="search-input" placeholder="Search endpoints...">
    </div>

    <!-- Hero Banner Image / GIF -->
    <img src="/banner.gif" alt="Hero Banner" class="hero-banner" onerror="this.style.display='none'">

    <!-- Interactive Music Player Bar Widget -->
    <div class="music-player-bar">
      <div class="music-info">
        <i class="fa-solid fa-compact-disc disc-icon" id="disc-icon"></i>
        <div class="track-details">
          <span class="track-title">Background Music</span>
          <span class="track-status" id="music-status">Tap to Play</span>
        </div>
      </div>
      <button class="music-control-btn" id="music-toggle-btn">
        <i class="fa-solid fa-play" id="music-icon"></i>
      </button>
      <audio id="bg-music" loop>
        <source src="/music.mp3" type="audio/mpeg">
      </audio>
    </div>

    <!-- Analytics Dashboard Stats -->
    <div class="stats-grid">
      <div class="stat-card active" data-filter="all">
        <span class="stat-num" id="stat-total">0</span>
        <span class="stat-label">Total APIs</span>
      </div>
      <div class="stat-card" data-filter="get">
        <span class="stat-num" id="stat-get">0</span>
        <span class="stat-label">GET Endpoints</span>
      </div>
      <div class="stat-card" data-filter="post">
        <span class="stat-num" id="stat-post">0</span>
        <span class="stat-label">POST Endpoints</span>
      </div>
      <div class="stat-card" data-filter="categories">
        <span class="stat-num" id="stat-cats">0</span>
        <span class="stat-label">Categories</span>
      </div>
    </div>

    <!-- Accordion API Categories -->
    <main>
      <div id="category-accordion" class="accordion-container"></div>
    </main>

    <footer class="footer" id="footer-text">
      Loading stats...
    </footer>
  </div>

  <!-- Interactive Modal Screen -->
  <div class="modal-overlay" id="api-modal">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h2 id="modal-title" class="modal-title">API Name</h2>
          <p id="modal-desc" class="modal-desc">API Description</p>
        </div>
        <button class="modal-close" id="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div id="modal-params-container"></div>
        <div class="modal-actions">
          <button class="btn btn-cancel" id="btn-cancel">Cancel</button>
          <button class="btn btn-submit" id="btn-submit">Submit</button>
        </div>
        <div id="response-box" class="response-box" style="display: none;">
          <pre id="response-data"></pre>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/theme.js"></script>
  <script src="/search.js"></script>
  <script src="/app.js"></script>
</body>
</html>
