<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JUBAYER REST API - Dark Nitro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <!-- Animated Nitro Red Ambient Glow -->
  <div class="nitro-glow"></div>

  <div class="container">
    <nav class="navbar">
      <div class="brand">
        <span class="logo-txt">JUBAYER API</span>
        <span class="badge-ui">PRO UI</span>
      </div>
      <div class="nav-right">
        <i class="fa-solid fa-magnifying-glass search-toggle" id="search-btn"></i>
      </div>
    </nav>

    <!-- Search Bar -->
    <div class="search-container" id="search-container">
      <input type="text" id="search-input" placeholder="Search endpoints...">
    </div>

    <!-- Analytics Dashboard Stats Header -->
    <div class="stats-grid">
      <div class="stat-card active" data-filter="all">
        <span class="stat-num" id="stat-total">0</span>
        <span class="stat-label">Total APIs</span>
      </div>
      <div class="stat-card" data-filter="get">
        <span class="stat-num" id="stat-get">0</span>
        <span class="stat-label">GET Endpoints</span>
      </div>
      <div class="stat-card" data-filter="post">
        <span class="stat-num" id="stat-post">0</span>
        <span class="stat-label">POST Endpoints</span>
      </div>
      <div class="stat-card" data-filter="categories">
        <span class="stat-num" id="stat-cats">0</span>
        <span class="stat-label">Categories</span>
      </div>
    </div>

    <!-- Accordion Accorded API Categories -->
    <main>
      <div id="category-accordion" class="accordion-container">
        <div class="loader-box">
          <div class="spinner"></div>
          <p>Loading Nitro Engine...</p>
        </div>
      </div>
    </main>

    <footer class="footer" id="footer-text">
      41 APIs in 21 categories
    </footer>
  </div>

  <!-- Interactive Modal Screen -->
  <div class="modal-overlay" id="api-modal">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h2 id="modal-title" class="modal-title">API Name</h2>
          <p id="modal-desc" class="modal-desc">API Description</p>
        </div>
        <button class="modal-close" id="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div id="modal-params-container">
          <!-- Dynamic Params Inputs -->
        </div>
        <div class="modal-actions">
          <button class="btn btn-cancel" id="btn-cancel">Cancel</button>
          <button class="btn btn-submit" id="btn-submit">Submit</button>
        </div>
        <div id="response-box" class="response-box" style="display: none;">
          <pre id="response-data"></pre>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
