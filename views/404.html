<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | JUBAYER API</title>

  <link rel="icon" type="image/x-icon" href="/favicon.ico">

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: {
              950: '#08070b',
              800: '#17141f',
              700: '#221e2e',
            },
            red: {
              500: '#ff1a40',
              600: '#e60026',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Poppins', 'sans-serif'],
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(-15px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            blink: {
              '0%, 100%': { opacity: '1' },
              '50%': { opacity: '0' },
            },
          },
          animation: {
            fadeIn: '0.8s ease forwards',
            blink: 'blink 0.7s infinite',
          },
        },
      },
    }
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #08070b;
      color: #fff;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      padding: 20px;
    }

    body::before {
      content: "";
      position: absolute;
      width: 450px;
      height: 450px;
      background: rgba(255, 26, 64, .15);
      filter: blur(140px);
      border-radius: 50%;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      animation: fadeIn .8s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .icon {
      width: 80px;
      height: 80px;
      margin: auto auto 24px;
      border-radius: 50%;
      background: rgba(255, 26, 64, .08);
      border: 1px solid rgba(255, 26, 64, .2);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ff1a40;
      font-size: 32px;
      box-shadow: 0 0 40px rgba(255, 26, 64, .2);
    }

    h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 90px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    h1 span {
      color: #ff1a40;
    }

    .typing {
      font-family: 'Poppins', sans-serif;
      font-size: 28px;
      font-weight: 700;
      height: 36px;
      margin-bottom: 18px;
    }

    .typed-text {
      color: #ff1a40;
    }

    .cursor {
      display: inline-block;
      width: 3px;
      background: #ff1a40;
      animation: blink .7s infinite;
      margin-left: 2px;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    p {
      color: #9ca3af;
      max-width: 520px;
      margin: auto;
      line-height: 1.8;
      margin-bottom: 35px;
    }

    .buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 24px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 600;
      transition: .25s;
    }

    .primary {
      background: #ff1a40;
      color: #fff;
    }

    .primary:hover {
      background: #e60026;
    }

    .secondary {
      background: #17141f;
      color: #d1d5db;
      border: 1px solid #2d2838;
    }

    .secondary:hover {
      background: #221e2e;
    }

    .footer {
      margin-top: 55px;
      color: #555;
      font-size: 12px;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="icon">
      <i class="fa-solid fa-code"></i>
    </div>

    <h1>4<span>0</span>4</h1>

    <div class="typing">
      <span class="typed-text"></span><span class="cursor">&nbsp;</span>
    </div>

    <p>
      The page or endpoint you are looking for doesn't exist, has been removed,
      or is temporarily unavailable.
    </p>

    <div class="buttons">
      <a href="/" class="btn primary">
        <i class="fa-solid fa-book"></i> Go back to Docs
      </a>

      <a href="javascript:history.back()" class="btn secondary">
        <i class="fa-solid fa-arrow-left"></i> Previous Page
      </a>
    </div>

    <div class="footer">
      JUBAYER REST API SYSTEM
    </div>

  </div>

  <script>
    const typedTextSpan = document.querySelector(".typed-text");

    const textArray = [
      "Page Not Found",
      "Error 404"
    ];

    const typingDelay = 150;
    const erasingDelay = 80;
    const newTextDelay = 2000;

    let textArrayIndex = 0;
    let charIndex = 0;

    function type() {
      if (charIndex < textArray[textArrayIndex].length) {
        typedTextSpan.textContent += textArray[textArrayIndex].charAt(charIndex);
        charIndex++;
        setTimeout(type, typingDelay);
      } else {
        setTimeout(erase, newTextDelay);
      }
    }

    function erase() {
      if (charIndex > 0) {
        typedTextSpan.textContent = textArray[textArrayIndex].substring(0, charIndex - 1);
        charIndex--;
        setTimeout(erase, erasingDelay);
      } else {
        textArrayIndex++;
        if (textArrayIndex >= textArray.length) textArrayIndex = 0;
        setTimeout(type, typingDelay + 700);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      setTimeout(type, 800);
    });
  </script>

</body>
</html>
